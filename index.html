</style><script>/* Fixed workspace shell with independently scrolling tool and inspector panels. */
(function(){

const views=document.createElement('select');views.id='workspaceViewSelect';views.setAttribute('aria-label','Drawing view');views.innerHTML=[['plan','Floor plan'],['3d','Perspective'],['iso','Isometric'],['front','South elevation'],['rear','North elevation'],['left','West elevation'],['right','East elevation'],['sec','Section']].map(([v,n])=>`<option value="${v}">${n}</option>`).join('');views.value=view;views.onchange=()=>setView(views.value);viewbar.append(views);move('isoCorner',viewbar);move('sec',viewbar);

for(const node of original){if(node.parentElement!==header)continue;if(node.id=='vb'||node.classList.contains('s')||node.classList.contains('quick')){node.hidden=true;continue}if(node.tagName=='INPUT'&&node.type=='file')continue;settingsBody.append(node)}
// The obsolete file buttons remain available to existing handlers, but File owns these actions.

const panelHead=document.createElement('div');panelHead.id='inspectorHead';const label=document.createElement('label');label.textContent='Workspace';const picker=document.createElement('select');picker.id='workspacePanelSelect';picker.setAttribute('aria-label','Workspace panel');picker.innerHTML=UI_TABS.map(([id,name])=>`<option value="${id}">${name}</option>`).join('');picker.value=tab;picker.onchange=()=>{tab=picker.value;pr()};label.append(picker);panelHead.append(label);$('#R').prepend(panelHead);$('#R').setAttribute('aria-label','Workspace inspector');$('#pp').setAttribute('tabindex','0');$('#L').setAttribute('aria-label','Drawing tools');$('#L').setAttribute('tabindex','0');$('#cmd').setAttribute('aria-label','CAD command input');
let previousPanel=tab;
function syncShell(){picker.value=tab;views.value=view;const closed=document.body.classList.contains('inspectorClosed');toggle.setAttribute('aria-expanded',String(!closed));toggle.textContent=closed?'Open panel':'Hide panel';$('#hint').title=$('#hint').textContent||''}
const shellPr=pr;pr=function(){shellPr();if(tab!==previousPanel){$('#pp').scrollTop=0;previousPanel=tab;document.body.classList.remove('inspectorClosed')}syncShell()};
const shellViewSync=syncViewControls;syncViewControls=function(){shellViewSync();syncShell()};

if(window.innerWidth<=900)document.body.classList.add('inspectorClosed');
syncShell();dirty=1;rq();
})();
